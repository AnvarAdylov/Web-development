<!DOCTYPE html>
<html>
	<head>
		<meta charset"UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <script src="https://kit.fontawesome.com/83da46b222.js" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="./css/style.css">
        <title> forms </title>
    </head>
    <body>
        <div class="wrapper">
            <header>
                <form class="form1">
                    <div class="content">
                        <div class="dot_bord"></div>
                        <div class="top_segment">
                            <img class="icon_login" src="./images/icon.PNG" alt="icon">
                            <span class="caption_one">Вход / </span><a class="hyperlink" href="#"> Регистрация </a>
                        
                            <div class="form-box">
                                
                                <div class="form-row">
                                    <label for="">Логин</label>
                                    <input type=”text”>
                                </div>
                                <div class="form-row">
                                    <label for="">Пароль</label>
                                    <input type="password"> 
                                </div>
                                <div class="form-row single_row">
                                    <p><input type="checkbox" name="ch1" id="ch1"><label class="text_checkbox" for="ch1"><span></span>Запомнить</label></p>
                                    <input type="submit" value="Войти">
                                </div>
                                <div class="form-row">
                                    <div class="flex_back">
                                        <a class="hyperlink" href="#"> Напомнить пароль</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </header>
            <main>
                <form class="form2">
                    <div class="form2-box">
                        <p class="caption_form2"> Опрос <p>
                        <p class="question"> Каким способом вы чаще оплачиваете электроэнергию? </p>
                        <div class="radio_block">
                            <p><input type="radio" name="rad1" id="rad1"><label class="text_radio" for="ch1"><span></span>В отделении банка</label></p>
                            <p><input type="radio" name="rad1" id="rad1"><label class="text_radio" for="ch1"><span></span>Банковской картой</label></p>
                            <p><input type="radio" name="rad1" id="rad1"><label class="text_radio" for="ch1"><span></span>Через терминал Qiwi</label></p>
                            <p><input type="radio" name="rad1" id="rad1"><label class="text_radio" for="ch1"><span></span>С помощью мобильного телефона</label></p>
                            <p><input type="radio" name="rad1" id="rad1"><label class="text_radio" for="ch1"><span></span>Автоматическим платежом</label></p>
                        </div>
                        <div class="form-row">
                        <input class="button2" type="submit" value="Ответить">
                        <a class="hyperlink2" href="#"> Все опросы</a>
                        </div>
                    </div>
                </form>
            </main>
            <footer>
                <form class="form3">
                    <div class="form3-box">
                        <div class="content3">
                            <div class="caption3"><p>SIGN IN TO YOUR ACCOUNT</p></div>
                            <div class="form-row3">
                                <label class="form3_label" for=""><i class="fa-regular fa-user"></i></label>
                                <input class="form3_input" type="text" value="Username">
                            </div>
                            <div class="form-row3">
                                <label class="form3_label" for=""><i class="fa-solid fa-lock"></i></label>
                                <input class="form3_input" type="password" value="Password"> 
                                
                            </div>
                            <span class="btn-sign">
                                <input class="button3" type="submit" value="SIGN IN">              
                            </span>
                            <p class="bottom_text">Not a member? <a class="hyperlink3" href="#">Sign Up Now <i class="fa-solid fa-arrow-right"></i></a></p>
                        </div>
                    </div>
                </form>
            </footer>
        </div>
        <script src="myscript.js"></script>
        <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
</body>
</html>
